name: Deploy EC2 with Current AMI

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy EC2 with Current AMI
    runs-on: ubuntu-latest
    if: vars.AWS_AMI_BUILDS_ENABLED == 'true'
    environment:
      name: ami-build
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "TF_STATE_BUCKET repository variable must name the pre-created Terraform state bucket."
            exit 1
          fi
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=golden-ami/terraform.tfstate" \
            -backend-config="region=ap-south-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Read current AMI ID
        id: ami
        shell: bash
        run: |
          if ! ami_id="$(terraform -chdir=terraform output -raw instance_ami_id)"; then
            echo "Terraform state must contain the instance_ami_id output. Run the Packer workflow first to create and deploy an AMI."
            exit 1
          fi
          if [[ ! "$ami_id" =~ ^ami-[0-9a-fA-F]+$ ]]; then
            echo "Terraform state returned an invalid instance AMI ID: $ami_id"
            exit 1
          fi
          echo "ami_id=$ami_id" >> "$GITHUB_OUTPUT"

      - name: Plan Terraform
        env:
          AMI_ID: ${{ steps.ami.outputs.ami_id }}
          TF_VAR_ssh_public_key: ${{ secrets.EC2_SSH_PUBLIC_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$TF_VAR_ssh_public_key" ]; then
            echo "EC2_SSH_PUBLIC_KEY repository secret must contain your OpenSSH public key."
            exit 1
          fi
          terraform -chdir=terraform plan -input=false -out=tfplan -var="ami_id=$AMI_ID"

      - name: Apply Terraform
        run: terraform -chdir=terraform apply -input=false tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
